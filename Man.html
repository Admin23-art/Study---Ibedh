<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página en Mantenimiento</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --text:#172033; --muted:#687287;
  --primary:#6757d9; --primary2:#8b7cf0; --border:#e5e8f0;
  --shadow:0 12px 35px rgba(35,42,70,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(135deg,#f8f9fd 0%,#f1f3fa 100%);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1000px;
  margin:auto;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:18px;
}

.logo {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.back-btn{
  border:2px solid #391db9;
  background:#fff;
  color:#000;
  padding:9px 18px;
  border-radius:50px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}

.back-btn:hover{
  background:#391db9;
  color:#fff;
  transform:translateY(-2px);
}

.container{
  max-width:800px;
  margin:auto;
  padding:40px 22px;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px 28px;
  box-shadow:var(--shadow);
  text-align:center;
  width:100%;
}

.mantenimiento-img {
  width: 100%;
  max-width: 280px;
  height: auto;
  margin: 0 auto 20px auto;
  display: block;
  border-radius: 16px;
}

.hero-title{
  font-size:28px;
  margin:0 0 12px;
  letter-spacing:-.5px;
}

.hero-desc{
  color:var(--muted);
  font-size:15px;
  line-height:1.6;
  margin:0 0 28px;
}

.btn-primary {
  padding: 14px 28px;
  border: 2px solid #391db9;
  border-radius: 50px;
  background: #6757d9;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
  display: inline-block;
  text-decoration: none;
}

.btn-primary:hover {
  background: #6757d9;
  color: #fff;
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(103, 87, 217, 0.45);
}

footer{
  max-width:1100px;
  margin:auto;
  padding:0 22px 35px;
  color:#8a91a2;
  font-size:12px;
  text-align:center;
}
</style>
</head>
<body>

<header class="topbar">
  
     </div>
     <button class="back-btn" onclick="window.location.href='Selec.html'" style="display: none;">
    ← Regresar
</button>
  </div>
</header>

<main class="container">
  <div class="card">
    <!-- Imagen del centro -->
    <img src="loading.gif" alt="Página en Mantenimiento" class="mantenimiento-img">
    
    <h1 class="hero-title">Página en Mantenimiento</h1>
    
    <p class="hero-desc">
      Estamos realizando mejoras y actualizaciones en este apartado para ofrecerte una mejor experiencia.<br>
      Por favor, vuelve a intentarlo más tarde o regresa al menú principal.
    </p>

    <button class="btn-primary" onclick="window.location.href='Selec.html'">
      Volver al Menú
    </button>
  </div>
</main>



</body>
</html>
